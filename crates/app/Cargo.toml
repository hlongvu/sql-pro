[package]
name = "sqlpro"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sqlpro"
path = "src/main.rs"

[dependencies]
sqlpro-core.workspace = true
sqlpro-drivers.workspace = true

gpui-kit.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
image.workspace = true

[dev-dependencies]
# Same gpui distribution gpui-kit pins; test-support enables headless UI tests.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
